name: ai_study_planner
description: AI Study Planner - Aplikasi perencana belajar mahasiswa
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.0
  fl_chart: ^0.68.0
  intl: ^0.20.0
  clock: ^1.0.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  flutter_localizations:
    sdk: flutter
  equatable: ^2.0.5

dev_dependencies:
  # Dibutuhkan integration_test/alur_rencana_ai_test.dart (paket dari SDK Flutter,
  # bukan paket pihak ketiga).
  integration_test:
    sdk: flutter
  very_good_analysis: ^5.1.0
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # fonts
  fonts:
    - family: DM Serif Display
      fonts:
        - asset: assets/fonts/dm_serif_display/DMSerifDisplay-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf

  assets:
    - assets/circles/
    - assets/brand/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/logo.png
  remove_alpha_ios: true

# Logo saat ini adalah PLACEHOLDER yang digenerate lewat skrip —
# sediakan logo asli 1024x1024 di assets/brand/logo.png lalu jalankan ulang:
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: '#FFFFFF'
  image: assets/brand/logo.png
  android_12:
    color: '#FFFFFF'
    image: assets/brand/logo.png